[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "out-dev", email = "s.r.schmitt@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastapi-microsoft-identity>=0.1.6",
]

[project.scripts]
backend = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "uvicorn>=0.54.0",
]
