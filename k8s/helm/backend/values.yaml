replicaCount: 1

backend:
  name: kortexa
  fullname: kortexa

containerPort: 8000

image:
  repository: kortexa-backend
  pullPolicy: IfNotPresent
  tag: dev

service:
  type: ClusterIP
  port: 8000

env:
  - name: DJANGO_DEBUG
    value: "false"
  - name: DJANGO_ALLOWED_HOSTS
    value: "localhost,127.0.0.1,testserver,kortexa"

resources: {}
