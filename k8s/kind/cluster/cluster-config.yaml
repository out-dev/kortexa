kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kortexa

nodes:
  - role: control-plane
    labels:
      env: dev
    extraMounts:
      - hostPath: C:/dev_k8s_setup/kind
        containerPath: /workspace
  - role: worker
    labels:
      env: dev
    extraMounts:
      - hostPath: C:/dev_k8s_setup/kind
        containerPath: /workspace
